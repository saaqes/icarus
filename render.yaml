# ICARUS en Render: un servicio web Node (sitio estático + API del constructor).
# La base de datos PostgreSQL vive en Neon (DATABASE_URL se define en el panel de Render).
services:
  - type: web
    name: icarus
    runtime: node
    plan: free
    # --include=dev: esbuild y TypeScript son devDependencies y se necesitan para compilar
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Cadena de conexión de Neon (Connection string, con ?sslmode=require). Se pega en Render > Environment.
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: db
      - key: EXPORT_TTL_DAYS
        value: 14
      # Configúralas en el panel de Render (Environment). Ver .env.example
      - key: WHATSAPP_NUMBER
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_NOTIFY_TO
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
    # Las cabeceras de seguridad (CSP, HSTS…) y las redirecciones de /forja/demos/* las aplica ahora server/static.ts.
